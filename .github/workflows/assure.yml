name: Assure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit under review
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      # The python-auth profile reads raw/REPOSITORY.json, raw/declaration.json and
      # raw/repository/<path>. This is the recipe from the Assure API quick start, section 15.
      - name: Write the Assure bundle
        run: |
          if git ls-files -s | grep -q '^1[26]0000 '; then
            echo 'a symbolic link or a submodule is tracked; the checker refuses it' >&2; exit 1
          fi
          bundle="$RUNNER_TEMP/assure-bundle"
          rm -rf "$bundle" && mkdir -p "$bundle/raw/repository"
          git ls-files -s | while read -r mode blob stage path; do
            mkdir -p "$bundle/raw/repository/$(dirname "$path")"
            cp "$path" "$bundle/raw/repository/$path"
          done
          cp declaration.json "$bundle/raw/declaration.json"
          {
            printf '{"schema":"assure.codeauth.repository/v1","commit":"%s","tree":"%s","files":[' \
              "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
            sep=''
            git ls-files -s | while read -r mode blob stage path; do
              printf '%s{"path":"%s","bytes":%s,"sha256":"%s","mode":"%s"}' "$sep" "$path" \
                "$(wc -c < "$path" | tr -d ' ')" "$(sha256sum "$path" | cut -c1-64)" "$mode"
              sep=','
            done
            printf '],"execution_authorized":false,"hardware_authorized":false,"industrial_release_authorized":false,'
            printf '"release_allowed":false,"physical_validation":false,"simulation":true,"self_approved":false}\n'
          } > "$bundle/raw/REPOSITORY.json"

      - name: Assure check
        uses: Symbolia-Assurance/assure-action@beta
        with:
          profile: python-auth-declared-model
          artefacts: ${{ runner.temp }}/assure-bundle
          requirements: requirements.md

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assure-verdict
          path: assure-verdict.json
          if-no-files-found: ignore
